id: sec-secret-001-placeholders
description: Placeholders e chamadas de método não são segredo.
files:
  app/src/main/resources/application.yml: |
    spring:
      datasource:
        password: ${DB_PASSWORD}
    app:
      api-key: ${SHIPPING_API_KEY:}
  app/src/main/java/com/empresa/pedidos/application/usecase/TokenUseCase.java: |
    package com.empresa.pedidos.application.usecase;

    public class TokenUseCase {
        public String emitir(String userId) {
            String token = tokenService.issue(userId);
            return token;
        }
    }
expect:
  SEC-SECRET-001: false
