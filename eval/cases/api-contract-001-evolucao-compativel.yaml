files:
  app/api/openapi.yaml: |
    openapi: 3.0.3
    info: {title: Contas, version: 1.0.0}
    paths:
      /contas/{id}:
        get:
          parameters:
            - {name: id, in: path, required: true, schema: {type: string}}
          responses:
            '200':
              description: ok
              content:
