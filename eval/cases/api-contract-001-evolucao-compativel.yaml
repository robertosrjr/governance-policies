                  schema: {$ref: '#/components/schemas/Conta'}
      /contas/{id}/extrato:
        get:
          responses:
            '200': {description: ok}
    components:
      schemas:
        Conta:
          type: object
          properties:
            id: {type: string}
            saldo: {type: number}
            moeda: {type: string}
