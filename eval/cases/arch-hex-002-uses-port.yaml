    package com.empresa.pedidos.application.usecase;

    import com.empresa.pedidos.application.port.out.OrderRepositoryPort;
    import com.empresa.pedidos.domain.model.Order;
    import java.util.Optional;

    public class GetOrderUseCaseImpl {
        private final OrderRepositoryPort repository;

        public GetOrderUseCaseImpl(OrderRepositoryPort repository) {
            this.repository = repository;
        }

        public Optional<Order> execute(String orderId) {
            return repository.findById(orderId);
        }
    }
