id: lgpd-log-001-object-without-pii
description: 'Objeto logado inteiro, mas sem dado pessoal (só id, valor e status): conforme.'
requires_llm: true
files:
  app/src/main/java/com/empresa/pedidos/domain/model/Pedido.java: |
    package com.empresa.pedidos.domain.model;

    import java.math.BigDecimal;

    public record Pedido(String id, BigDecimal valor, String status) {}
  app/src/main/java/com/empresa/pedidos/application/usecase/CriarPedidoUseCase.java: |
    package com.empresa.pedidos.application.usecase;

    import com.empresa.pedidos.domain.model.Pedido;
    import org.slf4j.Logger;
    import org.slf4j.LoggerFactory;

    public class CriarPedidoUseCase {
        private static final Logger logger = LoggerFactory.getLogger(CriarPedidoUseCase.class);

        public Pedido executar(Pedido pedido) {
            logger.info("Pedido criado: {}", pedido);
            return pedido;
        }
    }
expect:
  LGPD-LOG-001: false
