id: sec-crypto-001-apis-inseguras
description: MD5, AES sem modo, TLSv1, hostname sem verificação e Random gerando token.
tags:
- financeiro
files:
  app/src/main/java/com/empresa/conta/infrastructure/crypto/Seguranca.java: |
    package com.empresa.conta.infrastructure.crypto;

    import java.security.MessageDigest;
    import java.util.Random;
    import javax.crypto.Cipher;
    import javax.net.ssl.SSLContext;

    public class Seguranca {
        byte[] hash(byte[] d) throws Exception { return MessageDigest.getInstance("MD5").digest(d); }
        Cipher cifra() throws Exception { return Cipher.getInstance("AES"); }
        SSLContext tls() throws Exception { return SSLContext.getInstance("TLSv1"); }
        void cliente(HttpsURLConnection c) { c.setHostnameVerifier((host, session) -> true); }
        String otp() { return String.valueOf(new Random().nextInt(999999)); }
    }
expect:
  SEC-CRYPTO-001: true
