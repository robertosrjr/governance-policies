id: ai-fair-001-religiao-no-score
description: Religião e deficiência entram nas features do score de crédito.
requires_llm: true
tags:
- ia
files:
  app/src/main/java/com/empresa/credito/domain/service/FeaturesScoreCredito.java: |
    package com.empresa.credito.domain.service;

    import java.util.HashMap;
    import java.util.Map;

    public class FeaturesScoreCredito {
        public Map<String, Object> montar(Cliente cliente) {
            Map<String, Object> features = new HashMap<>();
            features.put("renda", cliente.renda());
            features.put("tempoConta", cliente.mesesDeConta());
            features.put("religiao", cliente.religiao());
            features.put("possuiDeficiencia", cliente.possuiDeficiencia());
            return features;
        }
    }
expect:
  AI-FAIR-001: true
