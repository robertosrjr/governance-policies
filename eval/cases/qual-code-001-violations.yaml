    package com.empresa.pedidos.infrastructure.adapter.out.client;

    import org.springframework.beans.factory.annotation.Autowired;

    public class EstoqueClient {
        @Autowired
        private RestClient restClient;

        public Object consultar(String sku) {
            try {
                return restClient.get().uri("/estoque/" + sku).retrieve().body(String.class);
            } catch (Exception e) {
                return null;
            }
        }
    }
