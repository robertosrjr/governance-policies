# CI do próprio repositório central: nenhuma mudança em políticas, prompts, motor ou
# bundle entra sem testes, validação, exports atualizados e eval sem regressão.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      llm_repeat:
        description: "Eval com LLM: repetições por caso (0 = não rodar)"
        default: "0"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-deps --require-hashes -r engine/requirements-dev.lock
      - name: Testes do motor
        run: python -m pytest
      - name: Validar políticas, waivers, prompts e cobertura do eval
        run: python -m governance validate
      - name: Exports gerados estão atualizados
        run: python -m governance export --check
      - name: Eval determinístico (sem regressão)
        run: python -m governance eval --out eval-offline.json

  eval-llm:
    # Gate de release do bundle: rodar antes de trocar modelo/prompt ou de ligar
    # llm.blocking em qualquer política. Resultado vira eval_evidence.
    if: github.event_name == 'workflow_dispatch' && inputs.llm_repeat != '0'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-deps --require-hashes -r engine/requirements.lock
      - name: Eval com LLM
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          REPEAT: ${{ inputs.llm_repeat }}
        run: python -m governance eval --llm --repeat "${REPEAT}" --out eval-llm.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-llm-${{ github.sha }}
          path: eval-llm.json
