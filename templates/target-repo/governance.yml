# Modo conta pessoal: copie para .github/workflows/governance.yml do repo-alvo.
# Com organização, NÃO use este arquivo: o ruleset (templates/org-ruleset.json) aplica
# o workflow central sem que o repo-alvo possa editá-lo.
#
# Mantenha a ref do 'uses:' e governance_ref iguais. O CODEOWNERS protege este arquivo,
# e o ruleset do repo exige o check "governance / governance".
name: governance

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  governance:
    uses: robertosrjr/governance-policies/.github/workflows/governance-required.yml@v1.9.0
    with:
      governance_ref: v1.9.0
    # Repasse só a chave do projeto (nunca `secrets: inherit`, que entrega todos os
    # segredos do repositório ao workflow central). O nome à direita é o do seu segredo.
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
