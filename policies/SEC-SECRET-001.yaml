id: SEC-SECRET-001
title: Segredo ou credencial no código ou em configuração versionada
version: 1.0.0
owner: appsec
adr: ADR-SEC-001
severity: CRITICAL
mode: enforce
scope:
  include: ["**/*"]
description: >-
  Chaves de API, tokens, senhas e chaves privadas não podem ser versionados (Secret Zero).
  O motor detecta formatos conhecidos (AWS, Google, GitHub, Slack, chave privada PEM) e
  atribuições literais a nomes como password/secret/token/api_key. O pipeline também
  roda o gitleaks sobre os commits do PR.
remediation: >-
  Remova o valor, revogue a credencial (ela já está no histórico) e leia de um cofre
  (AWS Secrets Manager, Vault) ou de variável de ambiente injetada no deploy.
targets: [pr-review, claude-code, aws-security-agent]
compliance:
  applicability: Todo arquivo versionado (código, configuração, IaC, scripts).
  compliant: credentials are read from a secrets manager or injected environment variables.
  non_compliant: API keys, tokens, passwords or private keys appear as literals in versioned files (CWE-798, CWE-321).
enforcement:
  deterministic:
    - type: regex
      pattern: 'AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_\-]{35}|gh[pousr]_[A-Za-z0-9]{36,}|xox[abprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(?i:(?:api[_-]?key|secret|passw(?:or)?d|senha|token)\w*["'']?\s*[:=]\s*["''][^"''\s$]{8,}["''])|(?i:(?:^|[.\s])(?:api[_-]?key|secret|passw(?:or)?d|senha|token)\w*\s*[:=]\s*(?![$\{<])[^\s"''#();]{8,}\s*$)'
      message: Credencial literal versionada (CWE-798). Revogue e mova para um cofre.
