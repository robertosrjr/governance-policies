id: LGPD-LOG-001
title: Dado pessoal em logs, traces, métricas ou exceções
version: 3.0.0
owner: privacidade
adr: ADR-LGPD-001
severity: CRITICAL
mode: enforce
scope:
  include: ["**/*.java", "**/*.kt"]
  exclude: ["**/src/test/**"]
description: >-
  Nenhum dado pessoal (CPF, CNPJ, RG, e-mail, telefone, cartão, senha) pode chegar a
  logs, traces, métricas ou mensagens de exceção sem mascaramento. A regra do motor
  cobre o caso direto em uma linha (identificador pessoal como argumento de log fora de
  mask/sanitize/redact). Os casos indiretos (toString() de objeto com dado pessoal, corpo
  de request, atributo de span, tag de métrica, chamada de log quebrada em várias linhas)
  ficam com o Jev: uma regex ampla marca as linhas que escrevem em log, span, métrica ou
  exceção, e o Jev julga cada uma (ADR-GOV-002). Consultivo até o eval justificar bloqueio.
remediation: >-
  Passe o valor por `PIISanitizer.mask(valor)` antes de logar, ou registre só um
  identificador técnico (id do pedido, hash). Nunca logue o objeto inteiro nem o corpo
  de request/response.
targets: [pr-review, claude-code, aws-security-agent]
compliance:
  applicability: Código Java/Kotlin de produção que escreve logs, spans, métricas ou exceções.
  compliant: personal data is masked (PIISanitizer.mask) or replaced by technical identifiers before reaching logs, traces, metrics or exception messages.
  non_compliant: CPF, CNPJ, RG, e-mail, phone, card or password values reach logs, traces, metric tags or exception messages unmasked.
enforcement:
  deterministic:
    - type: regex
      pattern: '(?i)\b(?:log(?:ger)?|system\.(?:out|err))\s*\.\s*(?:trace|debug|info|warn|error|print(?:ln|f)?)\s*\(.*(?:cpf|cnpj|\brg\b|e-?mail|telefone|celular|phone|cart[aã]o|card_?number|senha|password)'
      strip: '"(?:[^"\\]|\\.)*"|\b(?:PIISanitizer\.)?(?:mask|sanitize|redact)\w*\s*\([^()]*\)'
      message: Dado pessoal passado a log sem mascaramento (LGPD Art. 6º III e Art. 46).
  llm:
    engine: jev
    blocking: false
    # Linhas que escrevem em log, MDC, span/trace, baggage, métrica ou exceção. Ampla de
    # propósito: o que não casa aqui não é julgado (o recall do Jev para aqui).
    candidates: '(?i)\b(?:log(?:ger)?|system\.(?:out|err))\s*\.\s*(?:trace|debug|info|warn(?:ing)?|error|fatal|print(?:ln|f)?)\s*\(|\bmdc\.put\s*\(|\.set(?:attribute|tag|baggage)\w*\s*\(|\bbaggage\b|\.add(?:event|link)\s*\(|\btags?\.of\s*\(|\.(?:tags?|labels?)\s*\(|\bthrow\s+new\b|\bnew\s+\w*(?:exception|error)\s*\('
    threshold: 0.5
    question: |
      A linha {line} de `codigo` é: {text}
      Essa linha faz algum dado pessoal chegar sem mascaramento a um log, MDC, atributo
      ou evento de span/trace, baggage, tag ou label de métrica, ou mensagem de exceção?
      Dado pessoal: CPF, CNPJ, RG, documento, e-mail, telefone, cartão, senha, ou um
      objeto, registro ou corpo de request/response que contenha algum deles (o
      toString() implícito de um objeto inteiro conta; os campos dos tipos citados estão
      em `outros_arquivos`). Não conta: valor que passa por mask, sanitize ou redact;
      identificador técnico (id de pedido, id de cliente, hash); texto fixo sem dado.
